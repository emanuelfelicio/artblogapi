basePath: /api/v1
definitions:
  CompleteUploadRequest:
    properties:
      upload_id:
        type: string
    required:
    - upload_id
    type: object
  ErrorCode:
    enum:
    - PARSE_ERROR
    - VALIDATION_ERROR
    - CONFLICT_ERROR
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - UNPROCESSABLE_ENTITY
    - INTERNAL_SERVER_ERROR
    type: string
    x-enum-varnames:
    - ParseCode
    - ValidationCode
    - ConflictCode
    - UnauthorizedCode
    - ForbiddenCode
    - NotFoundCode
    - InvalidCode
    - InternalServerCode
  ErrorInfo-any:
    properties:
      code:
        $ref: '#/definitions/ErrorCode'
      details: {}
      message:
        type: string
    type: object
  ErrorInfo-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError:
    properties:
      code:
        $ref: '#/definitions/ErrorCode'
      details:
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        type: string
    type: object
  ErrorInfo-map_string_bool:
    properties:
      code:
        $ref: '#/definitions/ErrorCode'
      details:
        $ref: '#/definitions/map_string_bool'
      message:
        type: string
    type: object
  ErrorResponse-any:
    properties:
      error:
        $ref: '#/definitions/ErrorInfo-any'
    type: object
  ErrorResponse-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError:
    properties:
      error:
        $ref: '#/definitions/ErrorInfo-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError'
    type: object
  ErrorResponse-map_string_bool:
    properties:
      error:
        $ref: '#/definitions/ErrorInfo-map_string_bool'
    type: object
  FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  InitUploadRequest:
    properties:
      content_type:
        type: string
      file_size:
        minimum: 1
        type: integer
      purpose:
        type: string
    required:
    - content_type
    - file_size
    - purpose
    type: object
  InitUploadResponse:
    properties:
      upload_id:
        type: string
      upload_url:
        type: string
    type: object
  LoginRequest:
    properties:
      credential:
        description: Credential accepts email or username.
        example: john_doe
        maxLength: 255
        minLength: 3
        type: string
      password:
        example: StrongP@ssw0rd!
        minLength: 8
        type: string
    required:
    - credential
    - password
    type: object
  LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiMTIzNDU2NzgtMTIzNC0xMjM0LTEyMzQtMTIzNDU2Nzg5MDEyIiwiZXhwIjoxNzE5Mjc4NjAwfQ.signature
        type: string
      expires_in:
        example: 900
        type: integer
      token_type:
        example: Bearer
        type: string
    type: object
  MyProfileResponse:
    properties:
      avatar_url:
        type: string
      banner_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      is_active:
        type: boolean
      updated_at:
        type: string
      username:
        type: string
    type: object
  PublicProfileResponse:
    properties:
      avatar_url:
        type: string
      banner_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      username:
        type: string
    type: object
  RegisterRequest:
    properties:
      email:
        example: john.doe@email.com
        maxLength: 255
        type: string
      password:
        description: Password max length of 72 bytes is due to bcrypt's maximum password
          length limitation.
        example: StrongP@ssw0rd!
        minLength: 8
        type: string
      username:
        description: Username accepts only lowercase alphanumeric characters, dots,
          and underscores.
        example: john_doe
        maxLength: 30
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  RegisterResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiMTIzNDU2NzgtMTIzNC0xMjM0LTEyMzQtMTIzNDU2Nzg5MDEyIiwiZXhwIjoxNzE5Mjc4NjAwfQ.signature
        type: string
      expires_in:
        example: 900
        type: integer
      token_type:
        example: Bearer
        type: string
    type: object
  Response-internal_auth_LoginResponse:
    properties:
      data:
        $ref: '#/definitions/LoginResponse'
    type: object
  Response-internal_auth_RegisterResponse:
    properties:
      data:
        $ref: '#/definitions/RegisterResponse'
    type: object
  Response-internal_storage_InitUploadResponse:
    properties:
      data:
        $ref: '#/definitions/InitUploadResponse'
    type: object
  Response-internal_storage_UploadStatusResponse:
    properties:
      data:
        $ref: '#/definitions/UploadStatusResponse'
    type: object
  Response-internal_user_MyProfileResponse:
    properties:
      data:
        $ref: '#/definitions/MyProfileResponse'
    type: object
  Response-internal_user_PublicProfileResponse:
    properties:
      data:
        $ref: '#/definitions/PublicProfileResponse'
    type: object
  UpdateAvatarRequest:
    properties:
      upload_id:
        type: string
    required:
    - upload_id
    type: object
  UpdateBannerRequest:
    properties:
      upload_id:
        type: string
    required:
    - upload_id
    type: object
  UpdateProfileRequest:
    properties:
      bio:
        maxLength: 500
        type: string
      display_name:
        maxLength: 60
        type: string
    type: object
  UploadStatus:
    enum:
    - PENDING
    - PROCESSING
    - COMPLETED
    - REJECTED
    - EXPIRED
    - SUPERSEDED
    - DELETED
    - BOUND
    type: string
    x-enum-varnames:
    - UploadStatusPENDING
    - UploadStatusPROCESSING
    - UploadStatusCOMPLETED
    - UploadStatusREJECTED
    - UploadStatusEXPIRED
    - UploadStatusSUPERSEDED
    - UploadStatusDELETED
    - UploadStatusBOUND
  UploadStatusResponse:
    properties:
      failure_reason:
        type: string
      id:
        type: string
      status:
        $ref: '#/definitions/UploadStatus'
    type: object
  map_string_bool:
    additionalProperties:
      type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Social media API for posts, authentication, and feed management
  title: Artblog API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and returns an access token, setting
        a refresh token cookie.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      - description: Device ID
        in: header
        name: X-Device-ID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-internal_auth_LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      summary: User Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the active session and clears the refresh token cookie.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      security:
      - BearerAuth: []
      summary: User Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the refresh token cookie and issues a new access token.
      parameters:
      - description: Device ID
        in: header
        name: X-Device-ID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-internal_auth_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      summary: Refresh Access Token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RegisterRequest'
      - description: Device ID
        in: header
        name: X-Device-ID
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Response-internal_auth_RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse-map_string_bool'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      summary: Register a new user
      tags:
      - auth
  /uploads/{id}:
    get:
      description: Returns the current status of an upload by its ID.
      parameters:
      - description: Upload ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-internal_storage_UploadStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      security:
      - BearerAuth: []
      summary: Get upload status
      tags:
      - uploads
  /uploads/complete:
    post:
      consumes:
      - application/json
      description: Marks a pending upload as complete after the file has been uploaded
        directly to storage.
      parameters:
      - description: Complete upload request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CompleteUploadRequest'
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      security:
      - BearerAuth: []
      summary: Complete upload
      tags:
      - uploads
  /uploads/init:
    post:
      consumes:
      - application/json
      description: Initiates a new file upload and returns a pre-signed URL for direct
        upload.
      parameters:
      - description: Init upload request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/InitUploadRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Response-internal_storage_InitUploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      security:
      - BearerAuth: []
      summary: Init upload
      tags:
      - uploads
  /users/{username}:
    get:
      description: Returns public profile information for a given username.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-internal_user_PublicProfileResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      summary: Get public profile
      tags:
      - users
  /users/me:
    get:
      description: Returns the full profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-internal_user_MyProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      security:
      - BearerAuth: []
      summary: Get my profile
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates the display name and/or bio of the authenticated user.
      parameters:
      - description: Update profile request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-internal_user_MyProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - users
  /users/me/avatar:
    put:
      consumes:
      - application/json
      description: Sets the avatar of the authenticated user from a completed upload.
      parameters:
      - description: Update avatar request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateAvatarRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      security:
      - BearerAuth: []
      summary: Update avatar
      tags:
      - users
  /users/me/banner:
    put:
      consumes:
      - application/json
      description: Sets the banner of the authenticated user from a completed upload.
      parameters:
      - description: Update banner request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateBannerRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      security:
      - BearerAuth: []
      summary: Update banner
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
