basePath: /api/v1
definitions:
  ErrorCode:
    enum:
    - PARSE_ERROR
    - VALIDATION_ERROR
    - CONFLICT_ERROR
    - UNAUTHORIZED
    - FORBIDDEN
    - INTERNAL_SERVER_ERROR
    type: string
    x-enum-varnames:
    - ParseCode
    - ValidationCode
    - ConflictCode
    - UnauthorizedCode
    - ForbiddenCode
    - InternalServerCode
  ErrorInfo-any:
    properties:
      code:
        $ref: '#/definitions/ErrorCode'
      details: {}
      message:
        type: string
    type: object
  ErrorInfo-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError:
    properties:
      code:
        $ref: '#/definitions/ErrorCode'
      details:
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        type: string
    type: object
  ErrorInfo-map_string_bool:
    properties:
      code:
        $ref: '#/definitions/ErrorCode'
      details:
        $ref: '#/definitions/map_string_bool'
      message:
        type: string
    type: object
  ErrorResponse-any:
    properties:
      error:
        $ref: '#/definitions/ErrorInfo-any'
    type: object
  ErrorResponse-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError:
    properties:
      error:
        $ref: '#/definitions/ErrorInfo-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError'
    type: object
  ErrorResponse-map_string_bool:
    properties:
      error:
        $ref: '#/definitions/ErrorInfo-map_string_bool'
    type: object
  FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  LoginRequest:
    properties:
      credential:
        description: Credential accepts email or username.
        example: john_doe
        maxLength: 255
        minLength: 3
        type: string
      password:
        example: StrongP@ssw0rd!
        minLength: 8
        type: string
    required:
    - credential
    - password
    type: object
  LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiMTIzNDU2NzgtMTIzNC0xMjM0LTEyMzQtMTIzNDU2Nzg5MDEyIiwiZXhwIjoxNzE5Mjc4NjAwfQ.signature
        type: string
      expires_in:
        example: 900
        type: integer
      token_type:
        example: Bearer
        type: string
    type: object
  RegisterRequest:
    properties:
      email:
        example: john.doe@email.com
        maxLength: 255
        type: string
      password:
        description: Password max length of 72 bytes is due to bcrypt's maximum password
          length limitation.
        example: StrongP@ssw0rd!
        minLength: 8
        type: string
      username:
        description: Username accepts only lowercase alphanumeric characters, dots,
          and underscores.
        example: john_doe
        maxLength: 30
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  RegisterResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiMTIzNDU2NzgtMTIzNC0xMjM0LTEyMzQtMTIzNDU2Nzg5MDEyIiwiZXhwIjoxNzE5Mjc4NjAwfQ.signature
        type: string
      expires_in:
        example: 900
        type: integer
      token_type:
        example: Bearer
        type: string
    type: object
  Response-internal_auth_LoginResponse:
    properties:
      data:
        $ref: '#/definitions/LoginResponse'
    type: object
  Response-internal_auth_RegisterResponse:
    properties:
      data:
        $ref: '#/definitions/RegisterResponse'
    type: object
  map_string_bool:
    additionalProperties:
      type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Social media API for posts, authentication, and feed management
  title: Artblog API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and returns an access token, setting
        a refresh token cookie.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      - description: Device ID
        in: header
        name: X-Device-ID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-internal_auth_LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      summary: User Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the active session and clears the refresh token cookie.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      security:
      - BearerAuth: []
      summary: User Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the refresh token cookie and issues a new access token.
      parameters:
      - description: Device ID
        in: header
        name: X-Device-ID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-internal_auth_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      summary: Refresh Access Token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RegisterRequest'
      - description: Device ID
        in: header
        name: X-Device-ID
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Response-internal_auth_RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse-array_github_com_emanuelfelicio_artblogapi_config_validation_FieldError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse-map_string_bool'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse-any'
      summary: Register a new user
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
